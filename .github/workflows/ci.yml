name: Qualité

# Se déclenche à chaque envoi de code et à chaque proposition de fusion.
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── Étage 1 : rapide (~40 s), sans la pile ML ───────────────────────
  # Analyse statique + tests de la logique pure et des données. Aucun
  # téléchargement de modèle : ce sont ces contrôles qui doivent échouer
  # vite quand quelque chose casse.
  qualite:
    name: Analyse statique et logique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les outils
        run: python -m pip install --upgrade pip ruff pytest

      - name: Analyse statique (ruff)
        run: ruff check src tests

      - name: Vérifier que tous les modules compilent
        run: python -m compileall -q src

      - name: Tests de logique et d'intégrité des données
        run: pytest -m "not lourd"

  # ── Étage 2 : complet (~4 min), avec la pile ML ─────────────────────
  # Teste le vote de consensus, qui vit dans un module important torch et
  # chromadb. Séparé pour que l'étage 1 reste immédiat.
  tests-complets:
    name: Tests du moteur de décision
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements-dev.txt

      - name: Tests complets avec couverture
        run: pytest --cov=src --cov-report=term-missing

  # ── Étage 3 : l'image de déploiement se construit-elle ? ────────────
  # Pas de publication : on vérifie seulement que la TGR pourra construire
  # et lancer le service. Rien ne sert d'avoir un Dockerfile qui ne compile
  # plus depuis trois semaines.
  image-docker:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: assistant-tgr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier que les modules se chargent dans l'image
        run: |
          docker run --rm assistant-tgr:${{ github.sha }} \
            python -c "import sys; sys.path.insert(0, 'src'); import config, lexique, nettoyer_reponses; print('modules OK')"
